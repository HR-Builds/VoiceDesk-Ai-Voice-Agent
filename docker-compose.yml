version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: vd_postgres
    environment:
      POSTGRES_USER: voicedesk
      POSTGRES_PASSWORD: voicedesk123
      POSTGRES_DB: voicedesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vd_redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vd_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: